<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - Business Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
</head>

<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-blue-600">Business Manager</h1>
                </div>
                <div class="flex space-x-4">
                    <a href="/" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Dashboard</a>
                    <a href="/sales" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Sales</a>
                    <a href="/purchases" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Purchases</a>
                    <a href="/payments" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Payments</a>
                    <a href="/customers" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Customers</a>
                    <a href="/items" class="text-blue-600 font-semibold px-3 py-2 rounded-md">Items</a>
                    <a href="/reports" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Reports</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-6">
            <h2 class="text-3xl font-bold text-gray-800">Item Management</h2>
            <p class="text-gray-600 mt-2">Manage your inventory items</p>
        </div>

        <!-- Add Item Form -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Add New Item</h3>
            <form id="itemForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Item Name *</label>
                    <input type="text" id="name" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., Premium Cotton Fabric" />
                </div>
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                    <input type="text" id="category"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., Fabrics, Accessories" />
                </div>
                <div>
                    <label for="purchaseRate" class="block text-sm font-medium text-gray-700 mb-2">Purchase Rate
                        *</label>
                    <input type="number" id="purchaseRate" step="0.01" min="0" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                        placeholder="0.00" />
                </div>
                <div>
                    <label for="saleRate" class="block text-sm font-medium text-gray-700 mb-2">Sale Rate *</label>
                    <input type="number" id="saleRate" step="0.01" min="0" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                        placeholder="0.00" />
                </div>
                <div>
                    <label for="availableQuantity" class="block text-sm font-medium text-gray-700 mb-2">Initial
                        Stock</label>
                    <input type="number" id="availableQuantity" step="0.01" min="0" value="0"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                        placeholder="0" />
                </div>
                <div>
                    <label for="unit" class="block text-sm font-medium text-gray-700 mb-2">Unit *</label>
                    <select id="unit"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                        <option value="pcs">Pieces (pcs)</option>
                        <option value="meters">Meters</option>
                        <option value="kg">Kilograms (kg)</option>
                        <option value="liters">Liters</option>
                        <option value="boxes">Boxes</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-md transition duration-200">
                        Add Item
                    </button>
                </div>
            </form>
            <div id="messageBox" class="hidden mt-4 p-4 rounded-md"></div>
        </div>

        <!-- Items List -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Items List</h3>
                <button onclick="loadItems()"
                    class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-md">
                    Refresh
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Purchase Rate
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Sale Rate</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Stock</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Stock Value</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="8" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const apiUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8000';

        // Load items on page load
        window.addEventListener('DOMContentLoaded', loadItems);

        // Format currency
        function formatCurrency(amount) {
            return 'Rs. ' + parseFloat(amount).toFixed(2);
        }

        // Show message
        function showMessage(message, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = `mt-4 p-4 rounded-md ${type === 'success'
                ? 'bg-green-100 text-green-800 border border-green-400'
                : 'bg-red-100 text-red-800 border border-red-400'
                }`;
            messageBox.classList.remove('hidden');

            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 5000);
        }

        // Load items
        async function loadItems() {
            try {
                const response = await fetch(`${apiUrl}/api/items`);
                const items = await response.json();

                const tbody = document.getElementById('itemsTableBody');

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-4 text-center text-gray-500">No items found</td></tr>';
                    return;
                }

                tbody.innerHTML = items.map(item => {
                    const stock = parseFloat(item.available_quantity);
                    const stockClass = stock <= 10 ? 'text-red-600' : stock <= 50 ? 'text-yellow-600' : 'text-green-600';
                    const stockValue = stock * parseFloat(item.purchase_rate);

                    return `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.id}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.name}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.category || 'N/A'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatCurrency(item.purchase_rate)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatCurrency(item.sale_rate)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${stockClass}">
                                ${stock.toFixed(2)} ${item.unit}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatCurrency(stockValue)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <button 
                                    onclick="editItem(${item.id})"
                                    class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-xs mr-2"
                                >
                                    Edit
                                </button>
                                <button 
                                    onclick="deleteItem(${item.id})"
                                    class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs"
                                >
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('itemsTableBody').innerHTML =
                    '<tr><td colspan="8" class="px-6 py-4 text-center text-red-500">Error loading items</td></tr>';
            }
        }

        // Edit item
        let editingItemId = null;
        async function editItem(id) {
            try {
                const response = await fetch(`${apiUrl}/api/items/${id}`);
                const item = await response.json();

                // Populate form
                document.getElementById('name').value = item.name;
                document.getElementById('category').value = item.category || '';
                document.getElementById('purchaseRate').value = item.purchase_rate;
                document.getElementById('saleRate').value = item.sale_rate;
                document.getElementById('availableQuantity').value = item.available_quantity;
                document.getElementById('unit').value = item.unit;

                // Change button text
                const submitBtn = document.querySelector('#itemForm button[type="submit"]');
                submitBtn.textContent = 'Update Item';
                submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                submitBtn.classList.add('bg-green-600', 'hover:bg-green-700');

                // Store editing ID
                editingItemId = id;

                // Scroll to form
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        // Delete item
        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) {
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/api/items/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Item deleted successfully!', 'success');
                    loadItems();
                } else {
                    const error = await response.json();
                    showMessage(`Error: ${error.detail || 'Failed to delete item'}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        // Submit form
        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const itemData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value || null,
                purchase_rate: parseFloat(document.getElementById('purchaseRate').value),
                sale_rate: parseFloat(document.getElementById('saleRate').value),
                available_quantity: parseFloat(document.getElementById('availableQuantity').value) || 0,
                unit: document.getElementById('unit').value
            };

            try {
                let response;
                if (editingItemId) {
                    // Update existing item
                    response = await fetch(`${apiUrl}/api/items/${editingItemId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(itemData)
                    });
                } else {
                    // Create new item
                    response = await fetch(`${apiUrl}/api/items`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(itemData)
                    });
                }

                if (response.ok) {
                    showMessage(editingItemId ? 'Item updated successfully!' : 'Item added successfully!', 'success');
                    document.getElementById('itemForm').reset();

                    // Reset button
                    const submitBtn = document.querySelector('#itemForm button[type="submit"]');
                    submitBtn.textContent = 'Add Item';
                    submitBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                    submitBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');

                    editingItemId = null;
                    loadItems();
                } else {
                    const error = await response.json();
                    showMessage(`Error: ${error.detail || 'Failed to save item'}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        });
    </script>
</body>

</html>
